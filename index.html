<title>Diamond IQ</title>
<style>
:root{--bg:#eef2ea;--ink:#14281c;--card:#fff;--grass:#2f6b3f;--dirt:#c58b5a;--red:#b3202a;--gold:#f2b705;--line:#c9d3c4;--ok:#1d7a3a;--lock:#b9c2b4;

:root[data-theme="dark"]{--bg:#0e1c14;--ink:#e8efe4;--card:#16291d;--grass:#1f4f2d;--dirt:#a97449;--red:#e0535c;--line:#2c4635;--ok:#5bd17d;--lock:#35503e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 56px}
.logo{font:400 44px/1 "Alfa Slab One",Georgia,serif;margin:6px 0 2px}
.logo i{font-style:normal;color:var(--red)}
.tag{margin:0 0 16px;opacity:.8}
.hero{background:var(--grass);color:#fff;border-radius:14px;padding:16px}
.hero .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lvl{font:400 22px "Alfa Slab One",Georgia,serif}
.bar{height:12px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin:10px 0 4px}
.bar b{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .5s}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 20px;background:var(--red);color:#fff;font:700 18px inherit;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
h2{font:400 22px "Alfa Slab One",Georgia,serif;margin:26px 0 8px}
.path{display:flex;flex-direction:column;gap:18px;padding:8px 0}
.node{display:flex;align-items:center;gap:14px;border:0;background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer;padding:0}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.disc{flex:none;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--grass);box-shadow:0 6px 0 rgba(0,0,0,.3);position:relative}
.node.done .disc{background:var(--gold)}
.node.locked .disc{background:var(--lock);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.node.locked{cursor:not-allowed;opacity:.7}
.node strong{display:block;font-size:19px}
.node:focus-visible,.btn:focus-visible,.opt:focus-visible,.x:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.x{border:0;background:none;color:var(--ink);font-size:26px;cursor:pointer}
.top .bar{flex:1;background:var(--line);margin:0}
.top .bar b{background:var(--ok)}
.hearts{font-weight:700;color:var(--red);font-size:20px}
.field{width:100%;height:auto;display:block;margin:8px 0 12px;border-radius:12px;background:var(--grass)}
.outs{display:flex;gap:6px;align-items:center;font-weight:700;margin-bottom:4px}
.lamp{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);opacity:.6}
.lamp.on{background:var(--red);border-color:var(--red);opacity:1}
.q{font-size:20px;font-weight:600;margin:6px 0 12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;border-radius:12px;font:600 17px/1.35 inherit;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 13%,var(--card))}
.why{margin-top:14px;padding:12px 14px;border-left:6px solid var(--dirt);background:var(--card);border-radius:0 12px 12px 0}
.end{text-align:center;padding:24px 0}
.big{font:400 52px "Alfa Slab One",Georgia,serif}
.conf{position:fixed;top:-30px;font-size:24px;animation:fall 2.5s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}@media (prefers-reduced-motion:reduce){.conf{display:none}}
.pop{display:inline-block;background:var(--gold);color:#14281c;font-weight:700;padding:6px 14px;border-radius:999px;margin:6px 0}
</style>
</head>

var T=["Rookie","Little Leaguer","Travel Baller","JV Starter","Varsity","All-Conference","All-State","Hall of Famer"];
var BASES=[[220,150],[150,82],[80,150]];
var XY={P:[150,150],C:[150,238],"1B":[228,150],"2B":[168,92],"3B":[72,150],SS:[112,98],LF:[58,58],CF:[150,30],RF:[242,58],BR:[236,200],B:[174,246]};
var P={xp:0,done:[],streak:0,last:""},L=null,app=document.getElementById("app");
try{var s=JSON.parse(localStorage.getItem("diq"));if(s&&typeof s.xp==="number")P=s}catch(e){}
function save(){try{localStorage.setItem("diq",JSON.stringify(P))}catch(e){}}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function lvl(){return Math.floor(P.xp/100)}
function unlocked(i){return i===0||P.done.indexOf(i-1)>-1}
function home(){
  var l=lvl(),pct=P.xp%100,nxt=0;
  for(var i=0;i<U.length;i++){if(unlocked(i)&&P.done.indexOf(i)<0){nxt=i;break}nxt=i}
  var h='<h1 class="logo">Diamond <i>IQ</i></h1><p class="tag">Learn what to do at your position, one play at a time.</p>';
  h+='<div class="hero"><div class="row"><span class="lvl">Level '+(l+1)+': '+T[Math.min(l,T.length-1)]+'</span><span>🔥 '+P.streak+' day streak</span></div>';
  h+='<div class="bar"><b style="width:'+pct+'%"></b></div><div>'+P.xp+' XP. '+(100-pct)+' to the next level.</div></div>';
  h+='<button class="btn" id="go">'+(P.xp?"Continue: "+U[nxt][0]:"Start playing")+'</button>';
  h+='<button class="btn alt" id="mu">Sound: '+(P.mute?"off":"on")+'</button><h2>Your season</h2><div class="path">';
  U.forEach(function(u,i){var d=P.done.indexOf(i)>-1,lk=!unlocked(i);
    h+='<button class="node'+(d?" done":"")+(lk?" locked":"")+'" data-u="'+i+'" '+(lk?'aria-disabled="true"':"")+'><span class="disc">'+(lk?"🔒":d?"⭐":u[1])+'</span><span><strong>'+u[0]+'</strong>'+(lk?"Finish the last unit to unlock":d?"Complete. Tap to replay":"5 situations")+'</span></button>'});
  h+='</div>';
  app.innerHTML=h;
  document.getElementById("go").onclick=function(){begin(nxt)};
  document.getElementById("mu").onclick=function(){P.mute=!P.mute;save();home()};
  document.querySelectorAll(".node").forEach(function(n){n.onclick=function(){var i=+n.dataset.u;if(unlocked(i))begin(i)}});
}
function begin(u){L={u:u,deck:shuffle(U[u][2]).slice(0,5),i:0,hearts:3,right:0,xp:0,locked:false};ask()}
function field(q){
  var s='<svg class="field" viewBox="0 0 300 270" role="img" aria-label="Field showing runners and your position">';
  s+='<polygon points="150,238 228,150 150,70 72,150" fill="#c58b5a" stroke="#fff" stroke-width="3"/><polygon points="150,226 210,150 150,90 90,150" fill="#2f6b3f"/>';
  BASES.forEach(function(b,i){s+='<rect x="'+(b[0]-7)+'" y="'+(b[1]-7)+'" width="14" height="14" fill="#fff" transform="rotate(45 '+b[0]+' '+b[1]+')"/>';
    if(q[2][i]==="1")s+='<circle cx="'+b[0]+'" cy="'+(b[1]-18)+'" r="9" fill="#f2b705" stroke="#14281c" stroke-width="2"/>'});
  var p=XY[q[0]];
  s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="#b3202a" stroke="#fff" stroke-width="3"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">'+q[0]+'</text></svg>';
  return s;
}
function ask(){
  var q=L.deck[L.i],lamps="";L.locked=false;
  for(var k=0;k<2;k++)lamps+='<span class="lamp'+(k<q[1]?" on":"")+'"></span>';
  var h='<div class="top"><button class="x" id="quit" aria-label="Quit lesson">✕</button><div class="bar"><b style="width:'+(L.i/5*100)+'%"></b></div><span class="hearts" aria-label="'+L.hearts+' hearts left">♥ '+L.hearts+'</span></div>';
  h+='<div class="outs">Outs '+lamps+'</div>'+field(q)+'<p class="q">'+esc(q[3])+'</p><div class="opts" id="opts"></div><div id="fb" aria-live="polite"></div>';
  app.innerHTML=h;
  document.getElementById("quit").onclick=home;
  var box=document.getElementById("opts");
  shuffle([4,5,6,7]).forEach(function(i){var b=document.createElement("button");b.className="opt";b.textContent=q[i];b.onclick=function(){pick(i,b)};box.appendChild(b)});
}
function pick(i,btn){
  if(L.locked)return;L.locked=true;var q=L.deck[L.i],ok=i===4;
  document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(b.textContent===q[4])b.classList.add("right")});
  var cb=0;if(ok){L.right++;L.combo=(L.combo|0)+1;cb=L.combo>=3?5:0;L.xp+=10+cb;P.xp+=10+cb;beep(1)}else{L.hearts--;L.combo=0;btn.classList.add("wrong");beep(0)}
  var last=L.i+1>=L.deck.length||L.hearts<1;
  document.getElementById("fb").innerHTML='<div class="why"><strong>'+(ok?"Nice read! +"+(10+cb)+" XP"+(cb?" (3 in a row bonus!) ":". "):"Not quite. ")+'</strong>'+esc(q[8])+'</div><button class="btn" id="nx">'+(last?"Finish":"Continue")+'</button>';
  document.querySelector(".hearts").textContent="♥ "+L.hearts;
  var n=document.getElementById("nx");n.focus();n.onclick=function(){if(last)finish();else{L.i++;ask()}};
}
function finish(){
  var win=L.hearts>0,before=lvl();
  if(win){L.xp+=20;P.xp+=20;if(P.done.indexOf(L.u)<0)P.done.push(L.u);
    var t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
    if(P.last!==t){P.streak=P.last===y?P.streak+1:1;P.last=t}}
  save();
  var up=lvl()>before,h='<div class="end">';
  h+=win?'<div class="big">'+L.right+' / '+L.deck.length+'</div><p><strong>Lesson complete!</strong> Bonus +20 XP</p>':'<div class="big">Out!</div><p>You ran out of hearts. Review the explanations and try again.</p>';
  h+='<div class="pop">+'+L.xp+' XP this lesson</div>';
  if(up)h+='<p><strong>Level up! You’re now '+T[Math.min(lvl(),T.length-1)]+'.</strong></p>';
  if(win)h+='<p>🔥 '+P.streak+' day streak</p>';
  h+='<button class="btn" id="again">'+(win&&L.u+1<U.length&&P.done.indexOf(L.u+1)<0?"Next unit":"Play again")+'</button><button class="btn alt" id="hm">Back to home</button></div>';
  app.innerHTML=h;
  var nu=L.u;if(win)confetti();
  document.getElementById("again").onclick=function(){begin(win&&nu+1<U.length&&P.done.indexOf(nu+1)<0?nu+1:nu)};
  document.getElementById("hm").onclick=home;
}
var AC=null;
function beep(g){try{if(P.mute)return;AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain();o.connect(v);v.connect(AC.destination);o.frequency.value=g?660:180;o.type=g?"triangle":"sawtooth";v.gain.value=.08;o.start();o.stop(AC.currentTime+(g?.12:.25));if(navigator.vibrate)navigator.vibrate(g?20:80)}catch(e){}}
function confetti(){for(var i=0;i<24;i++){var e=document.createElement("span");e.className="conf";e.textContent=["⚾","⭐","🧢"][i%3];e.style.left=Math.random()*100+"%";e.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(e);setTimeout(function(x){x.remove()},4000,e)}}
home();
</script>
</body>
</html>
